# --- General Settings ---
run_name: "Athaliana_dCRE_S0"
input_hdf5: "data/results/modisco/arabidopsis_modisco_pelekeetal2024.hdf5"
species_tag: "Atha"
model_tag: "S0"

# This global setting tells all downstream steps to use the trimmed motif file.
use_trimmed_motifs: true

# --- Model input geometry ---
# Defaults are deepCRE vanilla: 1000 bp upstream of the TSS + 500 bp into the transcript,
# a 20 bp N spacer, then 500 bp from the transcript 3' end + 1000 bp downstream of the TTS
# = 3020 bp. Change these for other deepCRE setups or for phytoExpr; sequence_length is
# derived and validated. Omitting this block entirely uses the defaults shown.
window:
  upstream_len: 1000
  body_len: 500
  spacer: 20

# --- Pipeline Steps ---
# Set 'run: true' to execute a step, 'run: false' to skip it.

nomenclature:
  run: true
  matrix_type: "CWM"
  trim_motifs: true
  trim_threshold: 0.25

visualization:
  run: false

comparison:
  run: false
  min_overlap: 4
  top_n_plots: 3
  
  # --- Local Database Configuration ---
  # Path to the main directory where you unzipped the motif databases
  local_db_path: "data/meme_db/motif_databases.12.27/motif_databases"
  
  # List of the specific database subdirectories to compare against.
  # The script will create separate results for each of these.
  databases_to_compare:
    - 'JASPAR'
    - 'RNA'
    - 'MIRBASE'
      
importance:
  run: false

saliency:
  run: false 
  # saliency_scores_h5: "path/to/scores.h5"
  # metadata_csv: "path/to/meta_info.csv"
  # target_gene_id: "GENE_ID_TO_PLOT"

clustering:
  run: false
  dendrogram_filter: "F_"   # Optional: only show forward motifs on the dendrogram

ranging:
  run: true

projection:
  run: true
  blamm_executable: "/home/ibg-4/Desktop/blamm/blamm/build/blamm"
  reference_genome_fasta: "/home/ibg-4/Desktop/Rhome/moca/data/reference/arabidopsis_thaliana/Arabidopsis_thaliana.TAIR10.dna.toplevel.fa"
  reference_gff: "/home/ibg-4/Desktop/Rhome/moca/data/reference/arabidopsis_thaliana/Arabidopsis_thaliana.TAIR10.55.gff3"
  flank_size: 1000

annotation:
  run: true
  reference_gff: "/home/ibg-4/Desktop/Rhome/moca/data/reference/arabidopsis_thaliana/Arabidopsis_thaliana.TAIR10.55.gff3"
  chunk_size: 500000

  # Collapse the 2x F/R redundancy: nomenclature emits both strand matrices and BLAMM scans
  # with -rc, so each instance is reported twice. Keyed on (gene, position, epm) -- gene_id
  # must stay in the key, because a position inside two overlapping gene+-flank windows
  # legitimately annotates both genes.
  dedupe: true

  # Hits inside the transcript further than body_len from either border were never seen by
  # the model. 'drop' excludes them; 'pass' appends them unfiltered, labelled deep_intragenic.
  deep_intragenic: drop

  write_out_of_scope: false

  filters:
    band: q1q9              # none | minmax | q1q9  -- per-EPM, per-region positional band
    # Abundance gate: drops an EPM x region holding only a small share of that EPM's seqlets.
    # These are the low-abundance, near-zero-width bands (one seqlet gives q10 == q90).
    weight_region:
      enabled: true
      min_region_fraction: 0.15
    # Absolute floor; weight_region is relative and misses EPMs that are rare in both regions.
    min_region_seqlets: 20

  strict_merge:
    # Abort if fewer than this fraction of in-range occurrences match a gene key. Guards
    # against silently annotating a few percent of the data when the GFF build does not
    # match the one the projection was scanned against.
    min_match_rate: 0.5

browser_viz:
  run: true
  target_gene_list: "configs/gernot_genes.txt"

  #prediction_probabilities_csv: "path/to/your/predictions.csv"
  #true_expression_classes_csv: "path/to/your/expression_data.csv"
  #functional_annotation_txt: "path/to/your/functional_annotation.txt"
